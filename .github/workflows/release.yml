name: release

on:
  push:
    tags:
    - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: get-version
        uses: battila7/get-version-action@v2

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build ui
        run: |
          cd ui
          npm install
          npm run build
          cd ..

      - name: Build rttys release
        run: |
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm
          ./build-deb.sh amd64
          ./build-deb.sh arm64
          COMPRESS=1 ./build.sh linux amd64
          COMPRESS=1 ./build.sh linux arm64
          COMPRESS=1 ./build.sh windows amd64
          ./build.sh linux amd64

      - name: Upload rttys binary
        uses: actions/upload-artifact@v4
        with:
          name: rttys-binary
          path: rttys-${{ steps.get-version.outputs.version-without-v }}-linux-amd64/rttys

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            rttys_${{ steps.get-version.outputs.version-without-v }}_amd64.deb
            rttys_${{ steps.get-version.outputs.version-without-v }}_arm64.deb
            rttys-${{ steps.get-version.outputs.version-without-v }}-linux-amd64.tar.bz2
            rttys-${{ steps.get-version.outputs.version-without-v }}-linux-arm64.tar.bz2
            rttys-${{ steps.get-version.outputs.version-without-v }}-windows-amd64.tar.bz2
          draft: true

  docker:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - id: get-version
        uses: battila7/get-version-action@v2

      - name: Download rttys binary
        uses: actions/download-artifact@v4
        with:
          name: rttys-binary

      - name: Make rttys executable
        run: chmod +x rttys

      - uses: docker/login-action@v3
        with:
          username: jkhkr
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            jkhkr/rttys:${{ steps.get-version.outputs.version-without-v }}
            jkhkr/rttys:latest
